<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | EB Holdings</title><link rel="stylesheet" href="style.css"></head><body data-page="contact">
<header class="band"><div class="wrap"><h1>Get in touch</h1><p>Anything in your basket is added to the message automatically.</p></div></header>
<section><div class="wrap"><form id="form"><div><label for="n">Your name</label><input id="n" required></div><div><label for="t">About</label><select id="t"><option>Catering</option><option>Dresses</option><option>Something else</option></select></div><div><label for="d">Event date</label><input id="d" type="date"></div><div><label for="g">Guests</label><input id="g" type="number" min="1"></div><div class="full"><label for="m">Details</label><textarea id="m" rows="4"></textarea></div><div class="full"><button class="btn" type="submit">Send on WhatsApp</button> &nbsp;or email <span id="em"></span></div></form></div></section>
<script src="app.js"></script></body></html>
